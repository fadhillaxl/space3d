<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Panggung uji — model SATRIA</title>
<style>
  html,body{margin:0;height:100%;background:#20262e;color:#e6ecf2;font:13px ui-monospace,Consolas,monospace}
  #panggung{position:fixed;inset:0}
  #info{position:fixed;left:10px;top:10px;z-index:2;background:rgba(0,0,0,.55);padding:8px 10px;white-space:pre;line-height:1.5}
</style>
</head>
<body>
<!-- Panggung uji untuk memetakan bagian model, bukan bagian situs.
     Perlu server kecil karena satria-data.js besar; halaman situsnya
     sendiri tetap jalan dari file:// dengan klik dua kali. -->
<div id="panggung"></div>
<div id="info"></div>
<script src="../vendor/three.min.js"></script>
<script src="satria-data.js"></script>
<script src="satria-model.js"></script>
<script>
(function () {
  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#8b9097');
  var camera = new THREE.PerspectiveCamera(32, 16 / 10, 0.01, 500);
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  document.getElementById('panggung').appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight('#ffffff', '#c3c8ce', 1.0));
  var k = new THREE.DirectionalLight('#ffffff', 1.0); k.position.set(-6, 9, 12); scene.add(k);
  var f = new THREE.DirectionalLight('#dde6f0', 0.55); f.position.set(9, 2, -8); scene.add(f);

  var model = window.createSatriaModel();
  scene.add(model);
  model.updateMatrixWorld(true);
  var kotak = new THREE.Box3().setFromObject(model);
  var pusat = kotak.getCenter(new THREE.Vector3());
  var ukuran = kotak.getSize(new THREE.Vector3());

  var yaw = -0.9, pitch = 0.22, muat = 0.95;
  function pasang() {
    var tegak = Math.tan(THREE.MathUtils.degToRad(32) / 2);
    var jarak = Math.max((ukuran.y / 2) / tegak,
                         (Math.max(ukuran.x, ukuran.z) / 2) / (tegak * 1.6)) * 1.1 * muat;
    camera.position.set(
      pusat.x + jarak * Math.cos(pitch) * Math.sin(yaw),
      pusat.y + jarak * Math.sin(pitch),
      pusat.z + jarak * Math.cos(pitch) * Math.cos(yaw));
    camera.lookAt(pusat);
  }
  function ukur() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', ukur); ukur(); pasang();

  /* Warna beda per bagian, supaya batas tiap bagian terbaca saat dipetakan. */
  var asli = [];
  model.children.forEach(function (m, i) {
    asli.push(m.material);
    m.userData.warnaUji = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL((i * 0.137) % 1, 0.65, 0.55),
      roughness: 0.6, side: THREE.DoubleSide });
  });

  window.sudut = function (y, p, m) { yaw = y; pitch = p; if (m) muat = m; pasang(); return [yaw, pitch, muat]; };
  window.warnaUji = function (on) {
    model.children.forEach(function (mesh, i) {
      mesh.material = on ? mesh.userData.warnaUji : asli[i];
    });
  };
  window.hanya = function (nama) {
    model.children.forEach(function (m) { m.visible = !nama || m.name === nama; });
  };

  /* Satu bagian merah, sisanya abu pudar — cara paling cepat menjawab
     "yang mana Cube.002" tanpa menebak dari namanya. */
  var pudar = new THREE.MeshStandardMaterial({
    color: '#6f767e', roughness: 0.9, transparent: true, opacity: 0.22,
    depthWrite: false, side: THREE.DoubleSide });
  var tandai = new THREE.MeshStandardMaterial({
    color: '#ff2d2d', roughness: 0.5, side: THREE.DoubleSide });
  window.sorot = function (nama) {
    model.children.forEach(function (m, i) {
      m.visible = true;
      m.material = !nama ? asli[i] : (m.name === nama ? tandai : pudar);
    });
  };

  window.grup = function (g) {
    model.children.forEach(function (m) { m.visible = !g || m.userData.group === g; });
  };
  window.daftar = function () {
    return model.children.map(function (m, i) {
      var b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
      return { i: i, nama: m.name, grup: m.userData.group,
               pusat: [+c.x.toFixed(2), +c.y.toFixed(2), +c.z.toFixed(2)],
               ukuran: [+s.x.toFixed(2), +s.y.toFixed(2), +s.z.toFixed(2)] };
    });
  };

  document.getElementById('info').textContent =
    'bagian: ' + model.children.length +
    '\nkotak min ' + kotak.min.toArray().map(function (v) { return v.toFixed(2); }).join(', ') +
    '\nkotak max ' + kotak.max.toArray().map(function (v) { return v.toFixed(2); }).join(', ') +
    '\nukuran    ' + ukuran.toArray().map(function (v) { return v.toFixed(2); }).join(', ');

  (function gambar() { requestAnimationFrame(gambar); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
