<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness model — Space Shuttle</title>
<style>
  html, body { margin: 0; height: 100%; background: #46607d; }
  #stage { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 2;
    font: 12px ui-monospace, Consolas, monospace; color: #eaf0f6;
    background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 4px;
    line-height: 1.6; white-space: pre;
  }
  #err {
    position: fixed; left: 12px; bottom: 12px; z-index: 3; max-width: 70ch;
    font: 12px ui-monospace, Consolas, monospace; color: #ffd7d0;
    background: rgba(90,0,0,.75); padding: 8px 10px; border-radius: 4px;
  }
  #err:empty { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">harness · seret memutar · gulir memperbesar</div>
<div id="err"></div>

<script src="../vendor/three.min.js"></script>
<script src="./model.js"></script>
<script>
/* Harness pemeriksaan model.
   Latar birunya sengaja dibuat mendekati latar foto referensi supaya
   perbandingan render-lawan-foto tidak terganggu beda warna belakang. */
(function () {
  'use strict';
  var err = document.getElementById('err');
  function fail(msg) { err.textContent = msg; }

  if (typeof THREE === 'undefined') { return fail('three.min.js tidak termuat'); }

  var factory = window.createSpaceShuttleModel;
  if (typeof factory !== 'function') {
    return fail('model.js belum menyediakan window.createSpaceShuttleModel()');
  }

  var stage = document.getElementById('stage');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#46607d');

  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 2000);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  /* Pencahayaan meniru foto referensi: satu kunci dari depan-atas-kiri,
     satu isian lembut dari kanan, dan langit-tanah untuk bayangan lembut. */
  scene.add(new THREE.HemisphereLight('#dfe9f5', '#2a3a4a', 0.75));
  var key = new THREE.DirectionalLight('#ffffff', 0.85);
  key.position.set(-3, 6, 8);
  scene.add(key);
  var fill = new THREE.DirectionalLight('#cfe0f0', 0.35);
  fill.position.set(6, 2, -4);
  scene.add(fill);

  var model;
  try { model = factory(); } catch (e) { return fail('createSpaceShuttleModel() gagal: ' + e.message); }
  scene.add(model);

  /* Bingkai otomatis: kamera diatur dari kotak batas model, jadi harness
     tidak perlu tahu skala yang dipakai model. */
  var box = new THREE.Box3().setFromObject(model);
  var size = box.getSize(new THREE.Vector3());
  var mid = box.getCenter(new THREE.Vector3());
  var span = Math.max(size.x, size.y, size.z) || 1;
  var dist = span * 2.2;

  var yaw = 0, pitch = 0.12, radius = dist;
  function place() {
    camera.position.set(
      mid.x + radius * Math.cos(pitch) * Math.sin(yaw),
      mid.y + radius * Math.sin(pitch),
      mid.z + radius * Math.cos(pitch) * Math.cos(yaw));
    camera.lookAt(mid);
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  place();

  /* Kendali orbit sendiri — lebih ringan daripada menambah satu berkas lagi. */
  var dragging = false, px = 0, py = 0;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    dragging = true; px = e.clientX; py = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - px) * 0.008;
    pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - py) * 0.006));
    px = e.clientX; py = e.clientY;
    place();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    renderer.domElement.addEventListener(ev, function () { dragging = false; });
  });
  renderer.domElement.addEventListener('wheel', function (e) {
    e.preventDefault();
    radius = Math.max(span * 0.6, Math.min(span * 6, radius * (1 + Math.sign(e.deltaY) * 0.12)));
    place();
  }, { passive: false });

  /* Dipanggil skrip pemeriksa untuk mengambil sudut pandang tertentu. */
  window.setView = function (y, p, r) {
    yaw = y; pitch = p; if (r) radius = span * r;
    place();
    return { yaw: yaw, pitch: pitch, radius: radius };
  };
  window.modelInfo = function () {
    var parts = [];
    model.traverse(function (o) { if (o.isMesh) parts.push(o.name || '(tanpa nama)'); });
    return { size: size.toArray().map(function (n) { return +n.toFixed(2); }),
             meshes: parts.length, names: parts };
  };

  (function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();

  document.getElementById('hud').textContent =
    'harness · seret memutar · gulir memperbesar\n' +
    'ukuran model: ' + size.toArray().map(function (n) { return n.toFixed(1); }).join(' × ');
})();
</script>
</body>
</html>
